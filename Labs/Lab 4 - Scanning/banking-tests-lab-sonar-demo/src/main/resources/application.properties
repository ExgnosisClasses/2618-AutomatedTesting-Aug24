# Banking application configuration

spring.application.name=banking-tests-lab-sonar-demo

# Database
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.h2.Driver

# H2 console (open in dev, dangerous in prod)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Hardcoded API keys (would normally be injected as env variables)
banking.external.api.key=sk_live_4eC39HqLyjWDarjtT1zdp7dc
banking.signing.secret=hardcoded-signing-secret-do-not-do-this

# Debug logging in production-looking config
debug=true
logging.level.root=DEBUG
logging.level.org.springframework.security=TRACE

# Expose all actuator endpoints without authentication
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
